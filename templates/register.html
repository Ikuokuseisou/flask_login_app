<!DOCTYPE html>
<h2>ユーザー登録</h2>
<form method="POST">
    <div>
         <input type="text" name="username" placeholder="アカウント名">
    </div>
   
    <div>
        <input type="password" name="password" placeholder="パスワード">
    </div>
    <div>
        <button type="submit">登録</button>
    </div>
</form>

<p>
    すでにアカウントをお持ちの方は<a href="/login">ログイン</a>
</p>
