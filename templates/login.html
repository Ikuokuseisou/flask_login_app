<!DOCTYPE html>
<h2>ログイン</h2>

{% if error %}
  <p style="color: red;">{{ error }}</p>
{% endif %}

<form method="POST">

   <div>
    <input type="text" name="username" placeholder="アカウント名">
   </div>

   <div>
    <input type="password" name="password" placeholder="パスワード">
   </div> 

   <div>
    <button type="submit">ログイン</button>
   </div>

</form>

<p>
    アカウントお持ちでない方は
    <a href="/register">こちら</a>
</p>
